name: Private Korean keyboard IPA

on:
  workflow_dispatch:
  push:
    branches: [main, fix/korean-bluetooth-keyboard]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.2'
      - name: Test keyboard event sequences
        run: |
          swiftc OpenParsec/KoreanKeyboardRouter.swift Tests/main.swift -o "$RUNNER_TEMP/keyboard-tests"
          "$RUNNER_TEMP/keyboard-tests"
      - name: Archive for iPad and iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild archive \
            -project OpenParsec.xcodeproj -scheme OpenParsec \
            -destination 'generic/platform=iOS' -sdk iphoneos -arch arm64 \
            -configuration Release -archivePath "$RUNNER_TEMP/OpenParsec.xcarchive" \
            PRODUCT_BUNDLE_IDENTIFIER=com.zeberity123.OpenParsec.Korean \
            DEVELOPMENT_TEAM='' CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/build.log"
      - name: Package IPA for AltStore signing
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/OpenParsec.xcarchive/Products/Applications/OpenParsec.app" "$RUNNER_TEMP/ipa/Payload/"
          codesign --force --deep --sign - "$RUNNER_TEMP/ipa/Payload/OpenParsec.app"
          cd "$RUNNER_TEMP/ipa"
          ditto -c -k --keepParent Payload "$GITHUB_WORKSPACE/OpenParsec-Korean.ipa"
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 OpenParsec-Korean.ipa > OpenParsec-Korean.ipa.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: OpenParsec-Korean
          path: |
            OpenParsec-Korean.ipa
            OpenParsec-Korean.ipa.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
